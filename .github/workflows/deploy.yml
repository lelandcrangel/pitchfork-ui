name: Deploy to Hostinger

# Publishes the docs site to lelandrangel.com/pitchfork-ui/ and the theme
# builder to lelandrangel.com/pitchfork-ui/theme-builder/.
#
# The document root is /domains/lelandrangel.com/public_html, and server-dir is
# relative to the FTP account's root, which is above it. Dropping that prefix
# uploads a complete copy of the site to a directory nothing serves: the run
# succeeds, the live site never changes, and the only tell is "Server Files: 0"
# in the sync log. The post-deploy check at the end of this job exists to catch
# exactly that, by verifying the live URL serves what was just built.
#
# That document root is shared by four separately deployed projects — the main
# site plus /pitchfork-ui/, /nextthyme/ and /spatialstudio/. This workflow only
# ever writes inside pitchfork-ui/, and the exclude rules below keep each sync
# from deleting what the other one owns.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pitchfork-ui
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # The first run of this workflow spent four minutes building before the
      # upload step reported a missing secret. Check them up front instead, and
      # name the ones that are absent -- an unset secret arrives as an empty
      # string, so the action's own error only says "Input required".
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Earlier runs spent four minutes building before the upload reported a
      # missing secret, then a hostname that did not resolve. Both are knowable
      # up front. The upload action cannot say what is wrong with FTP_HOST
      # because the value is masked in its error, so the checks below name the
      # problem instead. None of them echo the value. This runs after setup-node
      # because the resolution check uses the same Node resolver as the action.
      - name: Check deploy credentials
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          missing=""
          [ -n "${FTP_HOST:-}" ]     || missing="$missing FTP_HOST"
          [ -n "${FTP_USER:-}" ]     || missing="$missing FTP_USER"
          [ -n "${FTP_PASSWORD:-}" ] || missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing -- set them under Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [[ "$FTP_HOST" =~ [[:space:]] ]]; then
            echo "::error::FTP_HOST contains whitespace, most likely a newline picked up when pasting. Re-enter it with no leading or trailing space."
            exit 1
          fi
          if [[ "$FTP_HOST" == *"://"* ]]; then
            echo "::error::FTP_HOST includes a scheme. Use a bare hostname or IP, with no ftp:// or ftps:// prefix."
            exit 1
          fi
          if [[ "$FTP_HOST" == */* ]]; then
            echo "::error::FTP_HOST includes a path. Use only the hostname or IP -- the upload directory comes from server-dir."
            exit 1
          fi
          if [[ "$FTP_HOST" =~ ^[^:]+:[0-9]+$ ]]; then
            echo "::error::FTP_HOST includes a port. Remove it -- the protocol setting selects the port."
            exit 1
          fi
          # Resolve with the same call the upload action makes (getaddrinfo via
          # dns.lookup) so this check cannot disagree with it. getent hosts did:
          # it timed out on a host FTPS had just connected to, and failed a
          # deploy that would have worked. Retry, so a transient DNS blip cannot
          # block a deploy either.
          attempt=1
          until [ "$attempt" -gt 3 ]; do
            result=$(node -e '
              const dns = require("node:dns");
              dns.lookup(process.env.FTP_HOST, (err) => {
                process.stdout.write(err ? "no:" + (err.code || "ERROR") : "yes");
              });
            ' 2>/dev/null || echo "no:NODE")
            [ "$result" = "yes" ] && break
            attempt=$((attempt + 1))
            [ "$attempt" -le 3 ] && sleep 3
          done
          if [ "${result:-}" != "yes" ]; then
            echo "::error::FTP_HOST did not resolve after 3 attempts (${result#no:}). hPanel shows the value under Files > FTP Accounts as 'FTP IP'; copy it exactly, with no scheme, port or path."
            exit 1
          fi

          echo "Credentials present; FTP_HOST resolves."

      - run: npm ci

      - run: npm run typecheck

      - name: Build site (tokens → react → metadata → llms → docs + theme builder)
        run: npm run build:hostinger

      - name: Verify build output
        run: |
          set -euo pipefail
          docs=apps/docs/storybook-static
          builder=apps/theme-builder/dist

          test -f "$docs/index.html"     || { echo "::error::$docs/index.html missing"; exit 1; }
          test -f "$docs/index.json"     || { echo "::error::$docs/index.json missing -- Storybook did not finish"; exit 1; }
          test -f "$builder/index.html"  || { echo "::error::$builder/index.html missing"; exit 1; }

          # The generated agent-facing files are the point of the docs deploy;
          # shipping the site without them silently breaks every published link.
          # These are produced by `build:llms`, which `build:hostinger` only
          # runs once the AI kit work is on main — deploy after that lands.
          for f in llms.txt llms-full.txt; do
            test -f "$docs/$f" || {
              echo "::error::$docs/$f missing -- build:hostinger did not run build:llms. Is the AI kit merged to main?"
              exit 1
            }
          done

          echo "Build output looks sane:"
          ls -la "$docs" | head -15

      # The docs sync owns ./pitchfork-ui/ and the theme-builder sync owns
      # ./pitchfork-ui/theme-builder/. If the Storybook build ever emitted a
      # theme-builder directory of its own, the exclude below would stop
      # protecting the live one and the two syncs would fight over it.
      - name: Guard the nested deploy target
        run: |
          set -euo pipefail
          if [ -e apps/docs/storybook-static/theme-builder ]; then
            echo "::error::storybook-static/theme-builder collides with the separately deployed theme builder"
            exit 1
          fi
          echo "No collision with the nested theme-builder deployment."

      - name: Deploy docs to /pitchfork-ui/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./apps/docs/storybook-static/
          server-dir: ./domains/lelandrangel.com/public_html/pitchfork-ui/
          # theme-builder/ lives inside this directory but is not produced by
          # the Storybook build. Without excluding it the sync treats it as
          # stale and deletes the live theme builder on every deploy.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            theme-builder/**

      - name: Deploy theme builder to /pitchfork-ui/theme-builder/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./apps/theme-builder/dist/
          server-dir: ./domains/lelandrangel.com/public_html/pitchfork-ui/theme-builder/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # A sync can report complete success while uploading to the wrong
      # directory, which is how the first four runs "succeeded" without ever
      # changing the site. Two files are fetched back, and both carry the
      # version just built:
      #
      #   llms.txt          a static file copied straight from apps/docs/public
      #   CHANGELOG-*.js    the compiled Storybook chunk behind the changelog page
      #
      # The second matters because the first cannot fail on its own: the static
      # files can land while the compiled docs are stale, and the changelog is
      # the page where that shows first. Checking a fingerprinted chunk also
      # proves this exact build is being served -- the name changes whenever the
      # content does, so a cached or leftover copy cannot satisfy it.
      - name: Verify the live site serves this build
        run: |
          set -euo pipefail
          base="https://lelandrangel.com/pitchfork-ui"
          version=$(node -p "require('./packages/react/package.json').version")
          static_dir=apps/docs/storybook-static

          changelog_chunk=$(cd "$static_dir/assets" && ls | grep -E '^CHANGELOG-[A-Za-z0-9_-]+\.js$' | head -1)
          if [ -z "$changelog_chunk" ]; then
            echo "::error::No CHANGELOG-*.js chunk in $static_dir/assets -- the changelog page did not compile."
            exit 1
          fi

          # A check that cannot fail is worse than no check, so confirm each
          # marker is in the local file before asking the server for it.
          grep -qF "Version $version." "$static_dir/llms.txt" || {
            echo "::error::Local llms.txt does not carry version $version -- the canary is broken, not the deploy."
            exit 1
          }
          grep -qF "react-v$version" "$static_dir/assets/$changelog_chunk" || {
            echo "::error::Local $changelog_chunk has no $version entry -- CHANGELOG.mdx is out of sync with packages/react/CHANGELOG.md."
            exit 1
          }

          # Download, then search the file. Piping curl into `grep -q` looks
          # tidier but races: grep exits at the first match, curl is still
          # writing, and the resulting EPIPE (exit 23) propagates through
          # pipefail as a failed check. The changelog chunk is 85 KB against a
          # 64 KB pipe buffer with its marker in the first 2 KB, so it loses
          # that race a few percent of the time -- reported as "not serving
          # $version yet", which is precisely the lie this step exists to
          # prevent. It grows more likely as the changelog does.
          check() {
            local body
            body=$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$1" 2>/dev/null) || return 1
            case "$body" in
              *"$2"*) return 0 ;;
              *) return 1 ;;
            esac
          }

          for attempt in 1 2 3 4 5; do
            if check "$base/llms.txt" "Version $version." \
               && check "$base/assets/$changelog_chunk" "react-v$version"; then
              echo "$base serves version $version, docs bundle included."
              exit 0
            fi
            echo "Attempt $attempt: not serving $version yet."
            sleep 10
          done

          echo "::error::$base did not serve version $version after the upload reported success. Check that server-dir points at the directory the site is actually served from."
          exit 1
