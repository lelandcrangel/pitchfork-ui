name: Deploy to Hostinger

# Publishes the docs site to lelandrangel.com/pitchfork-ui/ and the theme
# builder to lelandrangel.com/pitchfork-ui/theme-builder/.
#
# public_html on this host is shared by four separately deployed projects — the
# main site plus /pitchfork-ui/, /nextthyme/ and /spatialstudio/. This workflow
# only ever writes inside ./pitchfork-ui/, and the exclude rules below keep each
# sync from deleting what the other one owns.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pitchfork-ui
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # The first run of this workflow spent four minutes building before the
      # upload step reported a missing secret. Check them up front instead, and
      # name the ones that are absent -- an unset secret arrives as an empty
      # string, so the action's own error only says "Input required".
      # The first run spent four minutes building before the upload reported a
      # missing secret; the second spent four more before reporting a hostname
      # that does not resolve. Both are knowable in a second. The upload action
      # cannot say what is wrong with FTP_HOST because the value is masked in
      # its error, so the shape checks below name the problem instead. None of
      # them echo the value.
      - name: Check deploy credentials
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          missing=""
          [ -n "${FTP_HOST:-}" ]     || missing="$missing FTP_HOST"
          [ -n "${FTP_USER:-}" ]     || missing="$missing FTP_USER"
          [ -n "${FTP_PASSWORD:-}" ] || missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing -- set them under Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [[ "$FTP_HOST" =~ [[:space:]] ]]; then
            echo "::error::FTP_HOST contains whitespace, most likely a newline picked up when pasting. Re-enter it with no leading or trailing space."
            exit 1
          fi
          if [[ "$FTP_HOST" == *"://"* ]]; then
            echo "::error::FTP_HOST includes a scheme. Use a bare hostname or IP, with no ftp:// or ftps:// prefix."
            exit 1
          fi
          if [[ "$FTP_HOST" == */* ]]; then
            echo "::error::FTP_HOST includes a path. Use only the hostname or IP -- the upload directory comes from server-dir."
            exit 1
          fi
          if [[ "$FTP_HOST" =~ ^[^:]+:[0-9]+$ ]]; then
            echo "::error::FTP_HOST includes a port. Remove it -- the protocol setting selects the port."
            exit 1
          fi
          if ! getent hosts "$FTP_HOST" >/dev/null 2>&1; then
            echo "::error::FTP_HOST does not resolve. hPanel shows the value to use as 'FTP IP' under Files > FTP Accounts; copy it exactly, with no scheme, port or path."
            exit 1
          fi

          echo "Credentials present; FTP_HOST resolves."

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Build site (tokens → react → metadata → llms → docs + theme builder)
        run: npm run build:hostinger

      - name: Verify build output
        run: |
          set -euo pipefail
          docs=apps/docs/storybook-static
          builder=apps/theme-builder/dist

          test -f "$docs/index.html"     || { echo "::error::$docs/index.html missing"; exit 1; }
          test -f "$docs/index.json"     || { echo "::error::$docs/index.json missing -- Storybook did not finish"; exit 1; }
          test -f "$builder/index.html"  || { echo "::error::$builder/index.html missing"; exit 1; }

          # The generated agent-facing files are the point of the docs deploy;
          # shipping the site without them silently breaks every published link.
          # These are produced by `build:llms`, which `build:hostinger` only
          # runs once the AI kit work is on main — deploy after that lands.
          for f in llms.txt llms-full.txt; do
            test -f "$docs/$f" || {
              echo "::error::$docs/$f missing -- build:hostinger did not run build:llms. Is the AI kit merged to main?"
              exit 1
            }
          done

          echo "Build output looks sane:"
          ls -la "$docs" | head -15

      # The docs sync owns ./pitchfork-ui/ and the theme-builder sync owns
      # ./pitchfork-ui/theme-builder/. If the Storybook build ever emitted a
      # theme-builder directory of its own, the exclude below would stop
      # protecting the live one and the two syncs would fight over it.
      - name: Guard the nested deploy target
        run: |
          set -euo pipefail
          if [ -e apps/docs/storybook-static/theme-builder ]; then
            echo "::error::storybook-static/theme-builder collides with the separately deployed theme builder"
            exit 1
          fi
          echo "No collision with the nested theme-builder deployment."

      - name: Deploy docs to /pitchfork-ui/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./apps/docs/storybook-static/
          server-dir: ./pitchfork-ui/
          # theme-builder/ lives inside this directory but is not produced by
          # the Storybook build. Without excluding it the sync treats it as
          # stale and deletes the live theme builder on every deploy.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            theme-builder/**

      - name: Deploy theme builder to /pitchfork-ui/theme-builder/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./apps/theme-builder/dist/
          server-dir: ./pitchfork-ui/theme-builder/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
