name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      core_released: ${{ steps.release.outputs['packages/core--release_created'] }}
      react_released: ${{ steps.release.outputs['packages/react--release_created'] }}
      mcp_released: ${{ steps.release.outputs['packages/mcp--release_created'] }}
      tokens_released: ${{ steps.release.outputs['packages/tokens--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # Whenever release-please cut a release for a package we publish.
    if: >-
      needs.release-please.outputs.core_released == 'true' ||
      needs.release-please.outputs.react_released == 'true' ||
      needs.release-please.outputs.mcp_released == 'true' ||
      needs.release-please.outputs.tokens_released == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    # Must match the "Environment name" set on the npm trusted publisher.
    environment: release
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 24 ships an older npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build:tokens
      - run: npm run build:core
      - run: npm run build:react
      # @pitchfork-ui/react exports ./metadata, and @pitchfork-ui/mcp serves the
      # bundled copies. Both are generated, so both must be built before packing
      # or the published packages ship a broken entry point.
      - run: npm run build:metadata
      - run: npm run build:mcp
      # 0.15.1 published with `types` naming a file the build never wrote and
      # declarations node16 could not resolve. Both were invisible to CI's
      # typecheck and to 936 passing tests; only the built output shows them.
      - name: Check the built packages
        run: npm run check:package
      - name: Check the published types resolve under node16
        run: npx tsc --noEmit -p scripts/fixtures/node16-resolution/tsconfig.json
      - name: Check the generated artifacts are in the tarballs
        run: |
          set -euo pipefail
          npm pack --workspace @pitchfork-ui/core --dry-run 2>&1 | grep -q 'dist/index.js'
          npm pack --workspace @pitchfork-ui/react --dry-run 2>&1 | grep -q 'dist/metadata.json'
          npm pack --workspace @pitchfork-ui/mcp --dry-run 2>&1 | grep -q 'data/metadata.json'
          npm pack --workspace @pitchfork-ui/mcp --dry-run 2>&1 | grep -q 'data/tokens.json'
          npm pack --workspace @pitchfork-ui/tokens --dry-run 2>&1 | grep -q 'dist/css/variables.css'
          npm pack --workspace @pitchfork-ui/tokens --dry-run 2>&1 | grep -q 'dist/json/tokens.json'
          npm pack --workspace @pitchfork-ui/tokens --dry-run 2>&1 | grep -q 'README.md'
          npm pack --workspace @pitchfork-ui/tokens --dry-run 2>&1 | grep -q 'LICENSE'
      # The last thing between here and the registry. `check:package` asks
      # whether every bare import is declared; this asks whether every declared
      # workspace sibling can actually be installed -- which is a different
      # question, and the one that bites when release-please cuts react without
      # cutting core. A sibling going out in this same run is passed in rather
      # than looked up, because it is not on the registry yet and is not meant
      # to be.
      - name: Check every workspace dependency can be installed
        env:
          CORE_RELEASED: ${{ needs.release-please.outputs.core_released }}
          REACT_RELEASED: ${{ needs.release-please.outputs.react_released }}
          MCP_RELEASED: ${{ needs.release-please.outputs.mcp_released }}
          TOKENS_RELEASED: ${{ needs.release-please.outputs.tokens_released }}
        run: |
          set -euo pipefail
          # `if`, not `[ … ] && …`. Under `set -e` a failing test inside an
          # AND list is exempt while another command follows it, so the `&&`
          # form works here — but only by position: move one of these lines
          # last and the step starts failing whenever that package is not
          # being released. Measured both ways rather than assumed.
          shipping=""
          if [ "${CORE_RELEASED:-}" = "true" ]; then shipping="$shipping,core"; fi
          if [ "${REACT_RELEASED:-}" = "true" ]; then shipping="$shipping,react"; fi
          if [ "${MCP_RELEASED:-}" = "true" ]; then shipping="$shipping,mcp"; fi
          if [ "${TOKENS_RELEASED:-}" = "true" ]; then shipping="$shipping,tokens"; fi
          node scripts/check-publishable.mjs --publishing="${shipping#,}"

      # No NODE_AUTH_TOKEN: auth + provenance come from OIDC via the trusted publisher.
      - name: Publish @pitchfork-ui/tokens
        if: needs.release-please.outputs.tokens_released == 'true'
        run: npm publish --workspace @pitchfork-ui/tokens --access public
      - name: Publish @pitchfork-ui/core
        if: needs.release-please.outputs.core_released == 'true'
        run: npm publish --workspace @pitchfork-ui/core --access public
      # react depends on core, so core must reach the registry first -- a
      # consumer installing react before core exists gets an unresolvable tree.
      - name: Publish @pitchfork-ui/react
        if: needs.release-please.outputs.react_released == 'true'
        run: npm publish --workspace @pitchfork-ui/react --access public
      - name: Publish @pitchfork-ui/mcp
        if: needs.release-please.outputs.mcp_released == 'true'
        run: npm publish --workspace @pitchfork-ui/mcp --access public
