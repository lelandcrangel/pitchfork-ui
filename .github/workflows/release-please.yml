name: Release Please

on:
  push:
    branches:
      - main
  # A release can be tagged and still not reach the registry — a publish that
  # fails part-way leaves exactly that. release-please will not re-release a
  # version it has already cut, so without a manual trigger the only way to
  # publish the gap is to invent a release that nothing needed.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      core_released: ${{ steps.release.outputs['packages/core--release_created'] }}
      react_released: ${{ steps.release.outputs['packages/react--release_created'] }}
      mcp_released: ${{ steps.release.outputs['packages/mcp--release_created'] }}
      tokens_released: ${{ steps.release.outputs['packages/tokens--release_created'] }}
      elements_released: ${{ steps.release.outputs['packages/elements--release_created'] }}
      elements_react_released: ${{ steps.release.outputs['packages/elements-react--release_created'] }}
      elements_angular_released: ${{ steps.release.outputs['packages/elements-angular--release_created'] }}
      elements_vue_released: ${{ steps.release.outputs['packages/elements-vue--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # Whenever release-please cut a release for a package we publish, or by
    # hand to publish whatever the registry is missing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.core_released == 'true' ||
      needs.release-please.outputs.react_released == 'true' ||
      needs.release-please.outputs.mcp_released == 'true' ||
      needs.release-please.outputs.tokens_released == 'true' ||
      needs.release-please.outputs.elements_released == 'true' ||
      needs.release-please.outputs.elements_react_released == 'true' ||
      needs.release-please.outputs.elements_angular_released == 'true' ||
      needs.release-please.outputs.elements_vue_released == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    # Must match the "Environment name" set on the npm trusted publisher.
    environment: release
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 24 ships an older npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build:tokens
      - run: npm run build:core
      - run: npm run build:react
      # @pitchfork-ui/react exports ./metadata, and @pitchfork-ui/mcp serves the
      # bundled copies. Both are generated, so both must be built before packing
      # or the published packages ship a broken entry point.
      - run: npm run build:metadata
      # The elements and the three generated binding packages. `build:elements`
      # runs the Stencil build and then each wrapper's own build, so the
      # bindings cannot be packed from stale generated sources.
      - run: npm run build:elements
      - run: npm run build:elements-metadata
      - run: npm run build:mcp
      # 0.15.1 published with `types` naming a file the build never wrote and
      # declarations node16 could not resolve. Both were invisible to CI's
      # typecheck and to 936 passing tests; only the built output shows them.
      - name: Check the built packages
        run: npm run check:package
      - name: Check the published types resolve under node16
        run: npx tsc --noEmit -p scripts/fixtures/node16-resolution/tsconfig.json
      - name: Check the generated artifacts are in the tarballs
        run: |
          set -euo pipefail
          npm pack --workspace @pitchfork-ui/core --dry-run 2>&1 | grep -q 'dist/index.js'
          npm pack --workspace @pitchfork-ui/react --dry-run 2>&1 | grep -q 'dist/metadata.json'
          npm pack --workspace @pitchfork-ui/mcp --dry-run 2>&1 | grep -q 'data/metadata.json'
          npm pack --workspace @pitchfork-ui/mcp --dry-run 2>&1 | grep -q 'data/tokens.json'
          npm pack --workspace @pitchfork-ui/tokens --dry-run 2>&1 | grep -q 'dist/css/variables.css'
          npm pack --workspace @pitchfork-ui/tokens --dry-run 2>&1 | grep -q 'dist/json/tokens.json'
          npm pack --workspace @pitchfork-ui/tokens --dry-run 2>&1 | grep -q 'README.md'
          npm pack --workspace @pitchfork-ui/tokens --dry-run 2>&1 | grep -q 'LICENSE'
          # The elements ship their own token stylesheet and the metadata the
          # MCP server serves; the bindings ship generated sources that a stale
          # build would silently omit.
          npm pack --workspace @pitchfork-ui/elements --dry-run 2>&1 | grep -q 'dist/elements.json'
          npm pack --workspace @pitchfork-ui/elements --dry-run 2>&1 | grep -q 'dist/pitchfork/pitchfork.css'
          npm pack --workspace @pitchfork-ui/elements-react --dry-run 2>&1 | grep -q 'dist/index.js'
          npm pack --workspace @pitchfork-ui/elements-angular --dry-run 2>&1 | grep -q 'dist/fesm2022/pitchfork-ui-elements-angular.mjs'
          npm pack --workspace @pitchfork-ui/elements-vue --dry-run 2>&1 | grep -q 'dist/components.js'
      # The last thing between here and the registry, and it asks two questions
      # neither the build nor `check:package` can.
      #
      # `check:package` asks whether every bare import is declared. The first
      # question here is whether every declared workspace sibling can actually
      # be *installed*, which is what bites when release-please cuts react
      # without cutting core. A sibling going out in this same run is passed in
      # rather than looked up, because it is not on the registry yet and is not
      # meant to be.
      #
      # The second is whether this run can publish the packages it is about to
      # at all. Trusted publishing cannot create a package, so a name that has
      # never been published needs one publish by hand first -- otherwise the
      # steps below go out in dependency order until they meet it and stop,
      # leaving some packages published, the rest not, and every tag cut.
      # Refusing here costs a re-run; a half-release costs a version number.
      - name: Check every workspace dependency can be installed
        run: |
          set -euo pipefail
          # Every package in dependency order, not just the ones release-please
          # cut this time. Each publish step skips a version already on the
          # registry, so "shipping" now means "whatever the registry is
          # missing" — and that is what this check has to be told, or it
          # refuses a release for a gap the same run is about to fill.
          #
          # It refused exactly that: core@0.2.0 was tagged by an earlier
          # release and never published, because that run 404'd on it.
          # release-please will not re-release a version it has already cut,
          # so core was absent from --publishing while elements and react
          # declared ^0.2.0 against it, and every later release was blocked by
          # a dependency only this job could have satisfied.
          node scripts/check-publishable.mjs --publishing="core,tokens,elements,elements-angular,elements-react,elements-vue,mcp,react"

      # No NODE_AUTH_TOKEN: auth + provenance come from OIDC via the trusted publisher.
      #
      # Each step skips a version already on the registry, which is what makes
      # this job resumable. It stops at the first failure, so a partial publish
      # used to wedge it: tokens@0.5.0 went out, core@0.2.0 was refused for want
      # of a trusted publisher, and the re-run then died on tokens with "cannot
      # publish over" without ever reaching core. Fix the cause, press re-run,
      # and it now carries on from where it stopped.
      - name: Publish @pitchfork-ui/tokens
        run: node scripts/publish-if-needed.mjs tokens
      - name: Publish @pitchfork-ui/core
        run: node scripts/publish-if-needed.mjs core
      # react depends on core, so core must reach the registry first -- a
      # consumer installing react before core exists gets an unresolvable tree.
      - name: Publish @pitchfork-ui/react
        run: node scripts/publish-if-needed.mjs react
      # elements depends on core and tokens, and each binding package depends
      # on elements, so the order below is the dependency order and not a
      # preference. `check-publishable` enforces it rather than trusting it.
      - name: Publish @pitchfork-ui/elements
        run: node scripts/publish-if-needed.mjs elements
      - name: Publish @pitchfork-ui/elements-react
        run: node scripts/publish-if-needed.mjs elements-react
      - name: Publish @pitchfork-ui/elements-angular
        run: node scripts/publish-if-needed.mjs elements-angular
      - name: Publish @pitchfork-ui/elements-vue
        run: node scripts/publish-if-needed.mjs elements-vue
      - name: Publish @pitchfork-ui/mcp
        run: node scripts/publish-if-needed.mjs mcp
