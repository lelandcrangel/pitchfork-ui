name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      react_released: ${{ steps.release.outputs['packages/react--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # Only when release-please cut a new @pitchfork-ui/react release.
    if: needs.release-please.outputs.react_released == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    # Must match the "Environment name" set on the npm trusted publisher.
    environment: release
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 24 ships an older npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build:tokens
      - run: npm run build:react
      # No NODE_AUTH_TOKEN: auth + provenance come from OIDC via the trusted publisher.
      - run: npm publish --workspace @pitchfork-ui/react --access public
