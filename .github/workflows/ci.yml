name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

      # CHANGELOG.mdx is generated from packages/react/CHANGELOG.md by the docs
      # build. format:check runs before the build, so a stale committed copy
      # passes here and the build silently regenerates it -- which is how the
      # published changelog page sat on 0.13.2 while the library was on 0.15.0.
      - name: Check dark mode contrast (WCAG AA)
        run: npm run check:contrast
      - run: npm run test
      - name: Build (tokens → react → metadata → llms → docs)
        run: npm run build

      # Two failures only the built output can show: a package.json path that
      # names a file the build never writes, and a runtime diagnostic that
      # `import.meta.env.DEV` strips out of the published bundle. Both shipped
      # in 0.15.1 with every test passing.
      - name: Check the built packages
        run: npm run check:package

      # The repo's own tsconfigs use `moduleResolution: "bundler"`, which
      # forgives declaration files that node16 does not. 0.15.1 published
      # declarations whose relative specifiers carried no extension: under
      # node16 every import off the package resolved to nothing.
      - name: Check the published types resolve under node16
        run: npx tsc --noEmit -p scripts/fixtures/node16-resolution/tsconfig.json

      - name: Validate component metadata
        run: npm run build:metadata -- --strict
      - name: Validate llms.txt (every component linked, every link resolves)
        run: npm run build:llms -- --strict --verify
      - name: Test MCP server
        run: npm run test:mcp

      # The unit suite renders components from source in jsdom, where theme.css
      # is imported directly, so it cannot see a bundler regression: 933 tests
      # passed while every published component rendered with no design tokens at
      # all. This renders the built output in a real browser and fails if the
      # tokens do not resolve.
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium
      - name: Smoke-test the built Storybook
        run: npm run test:smoke -- --dir apps/docs/storybook-static
      - name: Security audit
        run: npm audit --audit-level=high
