name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

      # CHANGELOG.mdx is generated from packages/react/CHANGELOG.md by the docs
      # build. format:check runs before the build, so a stale committed copy
      # passes here and the build silently regenerates it -- which is how the
      # published changelog page sat on 0.13.2 while the library was on 0.15.0.
      - name: Check the Storybook changelog is in sync
        run: npm run sync-changelog -w @pitchfork-ui/docs -- --check
      - name: Check dark mode contrast (WCAG AA)
        run: npm run check:contrast
      - run: npm run test
      - name: Build (tokens → react → metadata → llms → docs)
        run: npm run build
      # vite-plugin-dts infers its output root from the whole program, so a
      # tsconfig `paths` entry pointing outside a package silently relocates
      # dist and strands the declared types path. Derive the path from
      # package.json rather than hardcoding it, so this catches both a wrong
      # field and a moved build output.
      - name: Check every declared types path points at a real file
        run: |
          set -euo pipefail
          for pkg in core react; do
            node -e '
              const fs = require("node:fs");
              const dir = process.argv[1];
              const pkg = JSON.parse(fs.readFileSync(`${dir}/package.json`, "utf8"));
              const declared = [pkg.types, pkg.exports?.["."]?.types].filter(Boolean);
              if (declared.length === 0) throw new Error(`${dir}: no types field to check`);
              for (const path of declared) {
                const full = `${dir}/${path.replace(/^\.\//, "")}`;
                if (!fs.existsSync(full)) throw new Error(`${dir}: types path "${path}" does not exist`);
              }
              console.log(`${dir}: ${declared.join(", ")}`);
            ' "packages/$pkg"
          done
      - name: Validate component metadata
        run: npm run build:metadata -- --strict
      - name: Validate llms.txt (every component linked, every link resolves)
        run: npm run build:llms -- --strict --verify
      - name: Test MCP server
        run: npm run test:mcp

      # The unit suite renders components from source in jsdom, where theme.css
      # is imported directly, so it cannot see a bundler regression: 933 tests
      # passed while every published component rendered with no design tokens at
      # all. This renders the built output in a real browser and fails if the
      # tokens do not resolve.
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium
      - name: Smoke-test the built Storybook
        run: npm run test:smoke -- --dir apps/docs/storybook-static
      - name: Security audit
        run: npm audit --audit-level=high
