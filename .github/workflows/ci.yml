name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - name: Build (tokens → react → metadata → llms → docs)
        run: npm run build
      - name: Validate component metadata
        run: npm run build:metadata -- --strict
      - name: Validate llms.txt (every component linked, every link resolves)
        run: npm run build:llms -- --strict --verify
      - name: Security audit
        run: npm audit --audit-level=high
