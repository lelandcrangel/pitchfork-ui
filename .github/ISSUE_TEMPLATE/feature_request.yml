name: Feature request
description: Suggest a new component, prop, or improvement
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point motivating the request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the API / component look like? Code sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're currently using, or other approaches you weighed.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is a new component
        - label: This is a new prop / variant on an existing component
        - label: I'm willing to help implement it
